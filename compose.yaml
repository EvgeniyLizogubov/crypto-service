services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydatabase']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: 'redis:latest'
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    labels:
      org.springframework.boot.ignore: "true"
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/mydatabase
      - SPRING_R2DBC_USERNAME=myuser
      - SPRING_R2DBC_PASSWORD=secret
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgres:5432/mydatabase
      - SPRING_LIQUIBASE_USER=myuser
      - SPRING_LIQUIBASE_PASSWORD=secret
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # - CRYPTO_PROVIDERS_MOCK_ENABLED=true
